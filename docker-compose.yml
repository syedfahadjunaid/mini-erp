# The whole mini ERP on one machine:
#
#   .\scripts\init-env.ps1           (once: writes .env with random local secrets)
#   docker compose up -d --build     then open http://localhost:5780, or run .\scripts\demo.ps1
#
# Web app: http://localhost:5780    API + Swagger UI: http://localhost:8780/swagger-ui.html
# Keycloak: http://localhost:8880
#
# All ports are bound to 127.0.0.1 and deliberately non-standard (other local projects hold the
# usual ones). Secrets come from .env; nothing has a default password.

name: mini-erp

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run scripts/init-env.ps1 to create .env}
      # Used once by infra/postgres/init/01-init.sh to create the logins
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?run scripts/init-env.ps1 to create .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?run scripts/init-env.ps1 to create .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run scripts/init-env.ps1 to create .env}
    ports:
      - "127.0.0.1:37432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP, so this only passes once the init script has finished
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d erp"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run scripts/init-env.ps1 to create .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run scripts/init-env.ps1 to create .env}
      # Tokens always say iss=http://localhost:8880/realms/erp, even though the API fetches the
      # signing keys over the internal Docker network (http://keycloak:8080).
      KC_HOSTNAME: http://localhost:8880
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Fill the ${...} placeholders of erp-realm.json, at the first import only.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?run scripts/init-env.ps1 to create .env}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?run scripts/init-env.ps1 to create .env}
    ports:
      - "127.0.0.1:8880:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The Keycloak image has no curl, so talk HTTP to the management port with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      # The first start builds Keycloak's server and imports the realm: minutes on a slow or
      # busy machine. Failures during start_period don't count, so "up --wait" doesn't give up.
      start_period: 300s
    restart: unless-stopped

  erp-api:
    build: ./services/erp-api
    image: mini-erp-api:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/erp?currentSchema=erp
      DB_APP_USERNAME: erp_app
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?run scripts/init-env.ps1 to create .env}
      DB_OWNER_USERNAME: erp_owner
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?run scripts/init-env.ps1 to create .env}
      # Browsers and scripts reach Keycloak at localhost:8880; this container reaches it as keycloak:8080.
      KEYCLOAK_ISSUER_URI: http://localhost:8880/realms/erp
      KEYCLOAK_BACKCHANNEL_URI: http://keycloak:8080/realms/erp
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?run scripts/init-env.ps1 to create .env}
      # The web app's address: the sign-in redirect URI is built from it.
      PUBLIC_URL: http://localhost:5780
      ERP_TIME_ZONE: ${ERP_TIME_ZONE:-UTC}
    ports:
      - "127.0.0.1:8780:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # The JRE image has no curl, so talk HTTP to the management port with bash's /dev/tcp
      # (explicitly bash: the image's /bin/sh is dash, which doesn't have it).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s   # Flyway migrations and JVM startup on a first run
    restart: unless-stopped

  # nginx: serves the React app and forwards /api, sign-in and sign-out to the API, so the
  # browser only ever talks to this one origin (Keycloak's redirect URI points here too).
  web:
    build: ./web
    image: mini-erp-web:local
    ports:
      - "127.0.0.1:5780:8080"
    depends_on:
      erp-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:

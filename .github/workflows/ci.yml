name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  erp-api:
    name: erp-api (Java 25, Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/erp-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Checkstyle + javac -Xlint -Werror + unit, module, integration and concurrency tests (Testcontainers)
      - run: sh mvnw -B verify

  web:
    name: web (React, TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      # Includes the TypeScript check (tsc --noEmit)
      - run: npm run build

  security-scan:
    name: Security scan (dependencies, secrets, misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  end-to-end:
    name: Docker Compose stack + demo flow
    needs: [erp-api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Random local secrets, the same way a developer creates .env (PowerShell 7 on the runner)
      - run: pwsh ./scripts/init-env.ps1
      # postgres, keycloak, erp-api and web (nginx + the built SPA)
      - run: docker compose up -d --build --wait
      # Purchase -> receipt -> reservation -> shipment -> invoice -> alert -> transfer -> reports
      - run: pwsh ./scripts/demo.ps1
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

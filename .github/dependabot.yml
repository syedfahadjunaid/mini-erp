version: 2
updates:
  - package-ecosystem: maven
    directory: /services/erp-api
    schedule:
      interval: weekly
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*", "org.springframework.modulith*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*"]
  - package-ecosystem: docker
    directories: ["/services/erp-api", "/web"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

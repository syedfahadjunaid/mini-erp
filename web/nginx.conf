# Serves the built single-page app and forwards everything dynamic to the API, so the browser
# only ever talks to one origin. The API is the app's backend-for-frontend: the browser holds an
# HttpOnly session cookie, never a token.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Security headers ("always": on error responses too).
    # CSP: scripts and styles only from this origin (no inline code), API calls only to this origin
    # (Keycloak is only ever navigated to, never fetched), no framing.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Inherited by every proxied location below (they set no headers of their own).
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The API: calls and downloads, the start of sign-in, Keycloak's redirect back, and sign-out.
    location /api/ {
        proxy_pass http://erp-api:8080;
        client_max_body_size 1m;
        proxy_read_timeout 120s;   # large exports
    }
    location /oauth2/ {
        proxy_pass http://erp-api:8080;
    }
    location /login/oauth2/ {
        proxy_pass http://erp-api:8080;
    }
    location = /logout {
        proxy_pass http://erp-api:8080;
    }

    # Built files have content hashes in their names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Anything else is a client-side route: serve index.html, never cached.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
